<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>EmbodiedCloud MVP</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <header class="topbar">
    <div>
      <strong>EmbodiedCloud</strong><span class="pill">MVP 0.1</span>
      <div class="tagline">让物理世界的 AI 开发，像 Web 开发一样简单。</div>
    </div>
    <div id="health" class="health">检查中…</div>
  </header>
  <main>
    <section class="hero">
      <div>
        <div class="eyebrow">ISAAC LAB CLOUD WORKSPACE</div>
        <h1>选择实验，启动工作区，直接改代码。</h1>
        <p>当前产品只解决一个问题：把 GPU、Isaac Lab 环境和可运行实验模板封装成浏览器工作区。</p>
      </div>
      <div class="metrics" id="metrics"></div>
    </section>

    <section>
      <div class="section-title"><h2>实验模板</h2><span>Template 才是产品，GPU 是资源</span></div>
      <div id="templates" class="cards"></div>
    </section>

    <section>
      <div class="section-title"><h2>我的工作区</h2><button class="secondary" onclick="refreshAll()">刷新</button></div>
      <div id="workspaces" class="workspace-list"></div>
    </section>
  </main>
  <div id="toast" class="toast"></div>
  <script src="/static/app.js"></script>
</body>
</html>
