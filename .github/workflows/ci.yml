name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v10
      - name: Lockfile consistency
        # uv.lock 与 pyproject.toml 不一致即红（实测：改一个 range 不重锁 → 退出码 1）
        run: make verify-lock
      - name: SBOM and vulnerability audit
        # 命中已知漏洞就红，而不是攒着：这是 `uv audit` 的实测行为（退出码 1）
        run: make sbom && make audit
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - name: Lint
        run: make lint
      - name: Type check
        run: make typecheck
      - name: Unit + integration tests
        run: make test
      - name: OpenAPI freshness
        run: make api-docs && git diff --exit-code docs/openapi.json
      - name: Release validation freshness
        run: make validate && git diff --exit-code docs/VALIDATION.json docs/VALIDATION.md
      - name: Pull docker-tier test image
        # docker 档只跑"与 daemon 同架构且已缓存"的镜像（本机 alpine:latest 是
        # amd64 占位条目，容器一起来就退，会让整档读数失真）
        run: docker pull node:22-alpine
      - name: Docker-backed tiers really ran
        # runner 自带 docker daemon，PG 与 Docker provider 两档都没有理由被跳过；
        # 被跳过即构建失败，而不是混在 skip 里静默通过。
        run: |
          python - <<'PY'
          import json, sys
          checks = json.load(open("docs/VALIDATION.json"))["checks"]
          bad = {
              k: v for k, v in checks.items()
              if k.startswith("integration_") and k != "integration_k8s" and v["status"] != "PASS"
          }
          if bad:
              sys.exit(f"集成档未真实执行：{ {k: v.get('note') for k, v in bad.items()} }")
          for k in sorted(checks):
              if k.startswith("integration_"):
                  print(k, checks[k]["status"], checks[k].get("note", ""))
          PY
      - name: Build artifact
        run: make build
      - name: Smoke (mock mode)
        run: make smoke
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: embodiedcloud-wheel
          path: dist/*.whl
          if-no-files-found: error
