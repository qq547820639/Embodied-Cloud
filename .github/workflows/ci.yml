name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - name: Lint
        run: make lint
      - name: Type check
        run: make typecheck
      - name: Unit + integration tests
        run: make test
      - name: OpenAPI freshness
        run: make api-docs && git diff --exit-code docs/openapi.json
      - name: Release validation freshness
        run: make validate && git diff --exit-code docs/VALIDATION.json docs/VALIDATION.md
      - name: Build artifact
        run: make build
      - name: Smoke (mock mode)
        run: make smoke
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: embodiedcloud-wheel
          path: dist/*.whl
          if-no-files-found: error
