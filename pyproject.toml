[project]
name = "embodiedcloud"
version = "0.7.0"
description = "EmbodiedCloud control plane for browser-first Isaac Lab GPU workspaces"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "sqlalchemy>=2.0,<3",
  "pydantic-settings>=2.5,<3",
  "email-validator>=2.1,<3",
  "alembic>=1.13,<2",
  "prometheus-client>=0.20,<1",
  "kubernetes>=28,<32",
  "pyyaml>=6,<7",
  "cryptography>=48.0.1,<51",
]

[project.optional-dependencies]
dev = [
  # 构建后端与判据用的版本区间，都必须在锁上：`python -m build --no-isolation` 用
  # 环境里的 setuptools 打包（否则隔离环境每次现向 PyPI 解析 [build-system].requires，
  # "build=PASS" 就成了当天的网络读数）。名字须与 [build-system].requires 一致，
  # 由 tests/test_validation_matrix.py 的常驻判据对账。
  "setuptools>=75",
  # 判据要判"锁住的版本满不满足一条 requires 区间"，这件事交给 packaging 实现，不自研。
  "packaging>=24,<27",
  # 9.0.3 修掉 tmpdir 处理漏洞（CVE-2025-71176，`uv audit` 实测命中）
  "pytest>=9.0.3,<10",
  "httpx>=0.27,<1",
  "ruff>=0.6,<1",
  "mypy>=1.10,<2",
  "build>=1.2,<2",
  # PostgreSQL 并发语义用例（tests/test_postgres_concurrency.py）需要驱动；
  # 与 [postgres] 生产 extra 同版本区间，binary 变体免编译。
  "psycopg[binary]>=3.1,<4",
  # 浏览器档默认复用系统 Chrome（channel=chrome），不自动下载浏览器二进制；
  # 无系统 Chrome 的环境用 `playwright install chromium` 兜底。
  "playwright>=1.55,<2",
  # S3 档（tests/test_s3_artifact_store.py）走真实 boto3/botocore 线协议；
  # 与 [s3] 生产 extra 同版本区间——用假 client 测不出 HEAD 无响应体这类协议事实。
  "boto3>=1.34,<2",
]
# 生产 PostgreSQL 驱动（alembic 迁移 + 运行时连接）。dev/默认安装不含，
# 生产镜像由 uv 按 uv.lock 装这一组（`uv sync --frozen --extra postgres`），见 runtime/Dockerfile.control-plane。
postgres = [
  "psycopg[binary]>=3.1,<4",
]
# 生产对象存储后端（S3CompatibleArtifactStore 懒加载 boto3）。与 [postgres] 同理：
# 默认/开发安装不带；要用 MinIO/云 S3 的镜像必须把 `--extra s3` 加进构建那一步（锁外现装会让镜像脱离 uv.lock，见 SUPPLY_CHAIN §4）；未安装时 store
# 明确抛 ArtifactStoreError，不静默降级到本地目录。
s3 = [
  "boto3>=1.34,<2",
]

[project.scripts]
embodiedcloud = "app.main:run"
# §25：边缘代理是**独立入口**，设备侧只装本包（标准库依赖）。
embodiedcloud-edge-agent = "edge_agent.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
markers = [
    "k8s_integration: requires real Kubernetes cluster + NVIDIA Device Plugin",
    "gpu_physical: requires physical NVIDIA GPU host",
    "streaming_physical: requires Isaac Sim streaming environment",
    "pg_integration: requires Docker daemon + cached postgres image (real row locks)",
    "docker_integration: requires Docker daemon (real containers)",
    "browser_integration: requires Playwright + Chrome/Chromium (real DOM)",
    "s3_integration: requires Docker daemon + cached S3-compatible server image (real object store)",
    "k8s_control_plane: requires Docker daemon + kind binary + cached kindest/node image (real cluster, no GPU)",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "edge_agent*"]

[tool.setuptools.package-data]
app = ["static/*"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF", "S"]
# BLE001: provider/orchestrator 边界的盲捕获是**有意设计**（任何底层异常都必须
#         转换为 workspace FAILED 状态，不能泄漏），见 docs/adr/0002-exception-boundaries.md。
# S101:   测试中的 assert 是正常用法。
# RUF001/RUF002/RUF003: 中文产品文案、注释与 docstring 中的全角标点是**有意使用**，非歧义字符。
ignore = ["BLE001", "S101", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# S105: 测试中的固定测试数据（password/token）用于断言脱敏行为，非真实凭据。
"tests/*" = ["S105"]
# 取证台在 import app/tests 之前必须先把仓库根挂上 sys.path（常驻判据
# tests/test_warm_pool_labs.py 要求"直接 python scripts/… 也要能跑"），
# 于是它的模块级 import 必然跟在那条语句之后 —— 这是形状要求，不是随手加的豁免。
"scripts/warm_pool_capacity_lab.py" = ["E402"]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
ignore_missing_imports = true
check_untyped_defs = true
