[project]
name = "embodiedcloud"
version = "0.3.0"
description = "EmbodiedCloud control plane for browser-first Isaac Lab GPU workspaces"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "sqlalchemy>=2.0,<3",
  "pydantic-settings>=2.5,<3",
  "email-validator>=2.1,<3",
  "alembic>=1.13,<2",
  "prometheus-client>=0.20,<1",
  "kubernetes>=28,<32",
  "pyyaml>=6,<7",
  "cryptography>=42,<47",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "httpx>=0.27,<1",
  "pytest-asyncio>=0.23,<1",
  "ruff>=0.6,<1",
  "mypy>=1.10,<2",
  "build>=1.2,<2",
]

[project.scripts]
embodiedcloud = "app.main:run"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
markers = [
    "k8s_integration: requires real Kubernetes cluster + NVIDIA Device Plugin",
    "gpu_physical: requires physical NVIDIA GPU host",
    "streaming_physical: requires Isaac Sim streaming environment",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["static/*"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF", "S"]
# BLE001: provider/orchestrator 边界的盲捕获是**有意设计**（任何底层异常都必须
#         转换为 workspace FAILED 状态，不能泄漏），见 docs/adr/0002-exception-boundaries.md。
# S101:   测试中的 assert 是正常用法。
# RUF001/RUF002/RUF003: 中文产品文案、注释与 docstring 中的全角标点是**有意使用**，非歧义字符。
ignore = ["BLE001", "S101", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# S105: 测试中的固定测试数据（password/token）用于断言脱敏行为，非真实凭据。
"tests/*" = ["S105"]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
ignore_missing_imports = true
check_untyped_defs = true
